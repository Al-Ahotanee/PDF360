# PDF360 — 100% Free Tier Render Blueprint (No Credit Card Required)
# Architecture:
# - pdf360-api: FastAPI Backend + embedded Celery Worker + internal Redis (Free Web Service)
# - pdf360-frontend: Next.js Frontend (Free Web Service)
# - Database: Neon Free Serverless PostgreSQL (external DATABASE_URL)

services:
  # ---------------------------------------------------------------------------
  # 1. Backend REST API + Embedded Celery Worker + Redis Queue (100% Free Tier)
  # ---------------------------------------------------------------------------
  - type: web
    name: pdf360-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: APP_NAME
        value: PDF360
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: API_V1_PREFIX
        value: /api/v1
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      # Neon PostgreSQL Connection String (Free Serverless Postgres)
      # e.g.: postgresql://user:pass@ep-cool-fog-123456.us-east-2.aws.neon.tech/pdf360?sslmode=require
      - key: DATABASE_URL
        sync: false
      # Storage Provider: "local" (default) or "s3" (Cloudflare R2 / AWS S3 / Supabase)
      - key: STORAGE_PROVIDER
        value: local
      - key: LOCAL_STORAGE_PATH
        value: /app/storage
      - key: S3_BUCKET_NAME
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      # CORS: Allow requests from frontend
      - key: CORS_ORIGINS
        value: "*"

  # ---------------------------------------------------------------------------
  # 2. Next.js Frontend Web Service (100% Free Tier)
  # ---------------------------------------------------------------------------
  - type: web
    name: pdf360-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    region: oregon
    envVars:
      - key: NODE_ENV
        value: production
      # Public URL of the FastAPI backend (e.g. https://pdf360-api.onrender.com/api/v1)
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false
