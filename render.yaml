# PDF360 — Render Infrastructure as Code Blueprint
# Deploy the entire stack (FastAPI Backend + Next.js Frontend + Celery Worker + Redis + Neon Postgres)
# See docs/03-deployment-render-neon.md for detailed setup instructions.

services:
  # ---------------------------------------------------------------------------
  # 1. Backend REST API (FastAPI + PyMuPDF + LibreOffice + Tesseract + OCR)
  # ---------------------------------------------------------------------------
  - type: web
    name: pdf360-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: APP_NAME
        value: PDF360
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: API_V1_PREFIX
        value: /api/v1
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      # Neon PostgreSQL Connection String (user fills this in the Render dashboard)
      # e.g.: postgresql://user:pass@ep-cool-fog-123456.us-east-2.aws.neon.tech/pdf360?sslmode=require
      - key: DATABASE_URL
        sync: false
      # Redis Connection (Internal Render Redis or Upstash)
      - key: REDIS_URL
        fromService:
          type: redis
          name: pdf360-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: pdf360-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: pdf360-redis
          property: connectionString
      # Storage Provider: "local" or "s3" (AWS S3, Cloudflare R2, MinIO, Supabase)
      - key: STORAGE_PROVIDER
        value: local
      - key: LOCAL_STORAGE_PATH
        value: /app/storage
      - key: S3_BUCKET_NAME
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      # CORS: Allow requests from the frontend service
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: pdf360-frontend
          property: url

  # ---------------------------------------------------------------------------
  # 2. Celery Background Worker (Asynchronous PDF operations)
  # ---------------------------------------------------------------------------
  - type: worker
    name: pdf360-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: celery -A app.workers.celery_app worker --loglevel=info
    plan: starter
    region: oregon
    envVars:
      - key: APP_NAME
        value: PDF360
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        fromService:
          type: web
          name: pdf360-api
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromService:
          type: web
          name: pdf360-api
          envVarKey: DATABASE_URL
      - key: REDIS_URL
        fromService:
          type: redis
          name: pdf360-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: pdf360-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: pdf360-redis
          property: connectionString
      - key: STORAGE_PROVIDER
        fromService:
          type: web
          name: pdf360-api
          envVarKey: STORAGE_PROVIDER
      - key: LOCAL_STORAGE_PATH
        value: /app/storage
      - key: S3_BUCKET_NAME
        fromService:
          type: web
          name: pdf360-api
          envVarKey: S3_BUCKET_NAME
      - key: S3_ACCESS_KEY
        fromService:
          type: web
          name: pdf360-api
          envVarKey: S3_ACCESS_KEY
      - key: S3_SECRET_KEY
        fromService:
          type: web
          name: pdf360-api
          envVarKey: S3_SECRET_KEY
      - key: S3_REGION
        fromService:
          type: web
          name: pdf360-api
          envVarKey: S3_REGION
      - key: S3_ENDPOINT_URL
        fromService:
          type: web
          name: pdf360-api
          envVarKey: S3_ENDPOINT_URL

  # ---------------------------------------------------------------------------
  # 3. Next.js Frontend Web Service
  # ---------------------------------------------------------------------------
  - type: web
    name: pdf360-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    region: oregon
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_BASE_URL
        fromService:
          type: web
          name: pdf360-api
          property: url

  # ---------------------------------------------------------------------------
  # 4. Redis Service
  # ---------------------------------------------------------------------------
  - type: redis
    name: pdf360-redis
    plan: free
    region: oregon
    ipAllowList: [] # internal private access only
